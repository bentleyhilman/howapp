<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HowApp</title>

  <!-- Favicon and Touch Icon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="appleicon.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* RESET & CUSTOM PROPERTIES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-glass: rgba(13, 16, 28, 0.75);
      --panel-glass: rgba(18, 22, 38, 0.85);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-hover: rgba(255, 255, 255, 0.07);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(124, 58, 237, 0.4);
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      background: #060810;
      color: var(--text-main);
      height: 100vh;
      height: -webkit-fill-available;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* DYNAMIC MOVING BACKGROUND GRADIENTS */
    .bg-gradient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      animation: floatMotion 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, #6366f1 0%, #a855f7 100%);
    }

    .orb-2 {
      bottom: -15%;
      right: -10%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, #ec4899 0%, #3b82f6 100%);
      animation-delay: -9s;
    }

    .orb-3 {
      top: 30%;
      right: 20%;
      width: 35vw;
      height: 35vw;
      background: radial-gradient(circle, #8b5cf6 0%, #06b6d4 100%);
      animation-duration: 22s;
    }

    @keyframes floatMotion {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(60px, -40px) scale(1.08); }
      66% { transform: translate(-40px, 50px) scale(0.95); }
      100% { transform: translate(30px, -30px) scale(1.04); }
    }

    /* FLOATING APP CONTAINER */
    #app-container {
      display: flex;
      width: 100%;
      max-width: 1400px;
      height: 100%;
      max-height: 900px;
      background: var(--bg-glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: containerAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes containerAppear {
      from { opacity: 0; transform: scale(0.98) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* SIDEBAR */
    .sidebar {
      width: 300px;
      background: var(--panel-glass);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    .brand-header {
      padding: 24px 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .user-pill-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      width: fit-content;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .user-pill-header:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transform: translateY(-1px);
    }

    .mini-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.65rem;
      color: #fff;
      overflow: hidden;
    }

    .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .sidebar-content {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      font-weight: 700;
      margin: 18px 8px 8px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.7;
    }

    .room-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 4px;
      position: relative;
    }

    .room-item:hover {
      background: var(--card-hover);
      color: #fff;
      transform: translateX(3px);
    }

    .room-item.active {
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid var(--border-active);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
    }

    .room-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .room-icon {
      font-weight: 600;
      color: #a855f7;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .room-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.88rem;
    }

    /* BADGES */
    .badge {
      font-size: 0.62rem;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .badge.public { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
    .badge.private { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
    .badge.dm { background: rgba(168, 85, 247, 0.12); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.2); }
    .badge.unread { background: var(--accent-grad); color: #fff; box-shadow: 0 2px 8px rgba(217, 70, 239, 0.4); }

    /* WORKSPACE CHAT AREA */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: transparent;
      position: relative;
      height: 100%;
    }

    .chat-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .chat-header-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    .mobile-menu-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .messages-container {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 70%;
      animation: messageSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message .avatar-container {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--card-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
    }

    .message .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

    .message-content-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message.own .message-content-wrapper { align-items: flex-end; }

    .message .meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      padding: 0 4px;
    }

    .message .author { font-weight: 600; color: var(--text-main); }

    .message-bubble {
      padding: 10px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      line-height: 1.5;
      font-size: 0.9rem;
      word-break: break-word;
      user-select: text;
      transition: all 0.2s ease;
    }

    .message.own .message-bubble {
      background: var(--accent-grad);
      border: none;
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.25);
    }

    .message:not(.own) .message-bubble { border-bottom-left-radius: 4px; }

    /* CHAT INPUT BAR */
    .chat-input-container {
      padding: 20px 32px 28px 32px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 14px 20px;
      border-radius: 30px;
      outline: none;
      font-size: 0.9rem;
      transition: all 0.25s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #8b5cf6;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent-grad);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
      flex-shrink: 0;
    }

    .send-btn:hover {
      transform: scale(1.08) rotate(-5deg);
      box-shadow: 0 6px 20px rgba(217, 70, 239, 0.4);
    }

    .send-btn:active { transform: scale(0.95); }

    .send-btn svg { width: 18px; height: 18px; fill: currentColor; margin-left: 2px; }

    .icon-btn {
      background: transparent;
      border: none;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover { background: var(--card-hover); color: #fff; }
    .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* MODALS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-overlay.hidden { display: none; }

    .modal {
      background: rgba(18, 22, 38, 0.95);
      border: 1px solid var(--border-subtle);
      padding: 28px;
      border-radius: 20px;
      width: 380px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      animation: modalUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalUp {
      from { transform: scale(0.95) translateY(15px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-header { font-size: 1.1rem; font-weight: 700; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

    button.btn-primary {
      background: var(--accent-grad);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    button.btn-secondary {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn-secondary:hover { background: var(--card-hover); color: #fff; }

    .auth-tabs { display: flex; border-bottom: 1px solid var(--border-subtle); margin-bottom: 4px; }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; }
    .auth-tab.active { color: #fff; border-bottom-color: #8b5cf6; }

    .avatar-preview-wrapper { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
    .avatar-preview-box { width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 1.5rem; color: var(--text-muted); }
    .avatar-preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .hidden { display: none !important; }

    /* MOBILE OVERLAY BACKDROP */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 9;
    }

    /* RESPONSIVE DESIGN BREAKPOINTS */
    @media (max-width: 768px) {
      body {
        padding: 0;
      }

      #app-container {
        border-radius: 0;
        border: none;
        max-height: 100%;
        height: 100vh;
        height: -webkit-fill-available;
      }

      .mobile-menu-btn {
        display: flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 80%;
        max-width: 300px;
        transform: translateX(-100%);
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.active {
        display: block;
      }

      .chat-header {
        padding: 16px 20px;
      }

      .messages-container {
        padding: 16px;
      }

      .message {
        max-width: 88%;
      }

      .chat-input-container {
        padding: 12px 16px 20px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- DYNAMIC MOVING BACKGROUND ORBS -->
  <div class="bg-gradient-orb orb-1"></div>
  <div class="bg-gradient-orb orb-2"></div>
  <div class="bg-gradient-orb orb-3"></div>

  <!-- FLOATING APP UI -->
  <div id="app-container">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    
    <div class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-logo">HowApp</div>
        <div class="user-pill-header" onclick="openAccountSettings()">
          <div class="mini-avatar" id="user-badge-avatar">?</div>
          <span id="user-badge-name">@guest</span>
        </div>
      </div>

      <div class="sidebar-content">
        <div class="section-title">
          <span>CHANNELS</span>
          <button class="icon-btn" onclick="openModal('create-room-modal')" title="Create Channel">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </div>
        <div id="room-list"></div>

        <div class="section-title" style="margin-top: 20px;">
          <span>DIRECT MESSAGES</span>
          <button class="icon-btn" onclick="openModal('create-dm-modal')" title="New DM">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </div>
        <div id="dm-list"></div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-header-title" id="current-room-title"># General</div>
          <div class="chat-header-status">
            <span class="status-dot"></span>
            <span>Realtime Cloud Sync Active</span>
          </div>
        </div>
        <button class="mobile-menu-btn" onclick="toggleSidebar(true)" title="Open Menu">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
      </div>

      <div class="messages-container" id="messages-container"></div>

      <div class="chat-input-container">
        <div class="chat-input-wrapper">
          <input type="text" id="message-input" placeholder="Message channel..." onkeydown="handleEnter(event, sendMessage)" />
        </div>
        <button class="send-btn" onclick="sendMessage()" title="Send Message">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="modal-overlay">
    <div class="modal">
      <div class="auth-tabs">
        <div id="tab-login-btn" class="auth-tab active" onclick="switchAuthTab('login')">Login</div>
        <div id="tab-signup-btn" class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</div>
      </div>

      <div id="login-view">
        <input type="text" id="login-username" placeholder="Username" style="margin-bottom:12px;" onkeydown="handleEnter(event, processLogin)">
        <input type="password" id="login-password" placeholder="Password" style="margin-bottom:16px;" onkeydown="handleEnter(event, processLogin)">
        <button class="btn-primary" style="width:100%" onclick="processLogin()">Login</button>
      </div>

      <div id="signup-view" class="hidden">
        <input type="text" id="signup-username" placeholder="Choose Username" style="margin-bottom:12px;" onkeydown="handleEnter(event, processSignup)">
        <input type="password" id="signup-password" placeholder="Choose Password" style="margin-bottom:16px;" onkeydown="handleEnter(event, processSignup)">
        <button class="btn-primary" style="width:100%" onclick="processSignup()">Create Account</button>
      </div>
    </div>
  </div>

  <!-- CREATE ROOM MODAL -->
  <div id="create-room-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">Create Channel</div>
      <input type="text" id="new-room-name" placeholder="Channel Name" onkeydown="handleEnter(event, createRoom)">
      <input type="password" id="new-room-pass" placeholder="Passcode (Optional)" onkeydown="handleEnter(event, createRoom)">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('create-room-modal')">Cancel</button>
        <button class="btn-primary" onclick="createRoom()">Create</button>
      </div>
    </div>
  </div>

  <!-- PASSCODE ENTER MODAL -->
  <div id="passcode-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">Protected Channel</div>
      <p style="font-size:0.8rem; color:var(--text-muted);">Enter passcode to join:</p>
      <input type="password" id="room-pass-input" placeholder="Passcode" onkeydown="handleEnter(event, verifyPasscode)">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('passcode-modal')">Cancel</button>
        <button class="btn-primary" onclick="verifyPasscode()">Join</button>
      </div>
    </div>
  </div>

  <!-- CREATE DM MODAL -->
  <div id="create-dm-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">Start Direct Message</div>
      <input type="text" id="dm-target-username" placeholder="Username" onkeydown="handleEnter(event, createDM)">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal('create-dm-modal')">Cancel</button>
        <button class="btn-primary" onclick="createDM()">Start DM</button>
      </div>
    </div>
  </div>

  <!-- ACCOUNT SETTINGS MODAL -->
  <div id="account-settings-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">Account Settings</div>
      <label style="font-size: 0.75rem; color: var(--text-muted);">Username</label>
      <input type="text" id="settings-username" disabled style="opacity: 0.5;">

      <label style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">New Password</label>
      <input type="password" id="settings-new-password" placeholder="Leave blank to keep current">

      <label style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Profile Picture</label>
      <div class="avatar-preview-wrapper">
        <div class="avatar-preview-box">
          <img id="avatar-preview-img" class="hidden" />
          <span id="avatar-preview-placeholder">?</span>
        </div>
        <input type="file" id="avatar-file-input" accept="image/*" onchange="handleAvatarSelect(event)" style="font-size: 0.75rem;">
      </div>

      <div class="modal-actions" style="margin-top: 8px;">
        <button class="btn-secondary" onclick="processLogout()" style="background: rgba(239, 68, 68, 0.15); color: var(--danger); border: none; margin-right: auto;">Log Out</button>
        <button class="btn-secondary" onclick="closeModal('account-settings-modal')">Cancel</button>
        <button class="btn-primary" onclick="saveAccountSettings()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- CREATOR ROOM SETTINGS MODAL -->
  <div id="creator-settings-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">Manage Channel</div>
      <input type="text" id="edit-room-name" placeholder="Channel Name">
      <input type="password" id="edit-room-pass" placeholder="Passcode (blank for Public)">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="deleteRoom()" style="background: rgba(239, 68, 68, 0.15); color: var(--danger); border: none; margin-right: auto;">Delete</button>
        <button class="btn-secondary" onclick="closeModal('creator-settings-modal')">Cancel</button>
        <button class="btn-primary" onclick="saveRoomEdits()">Save</button>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, 
      onSnapshot, addDoc, query, orderBy, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAj5N-Y00BUJOKUaPv9zhi3AxGoV9Xgl2Q",
      authDomain: "realhowapp.firebaseapp.com",
      projectId: "realhowapp",
      storageBucket: "realhowapp.firebasestorage.app",
      messagingSenderId: "842591375022",
      appId: "1:842591375022:web:2635d947ba948d2874673f",
      measurementId: "G-9Z5DPNQXV2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    let currentRoomId = null;
    let pendingRoomId = null;
    let targetCreatorRoomId = null;
    let tempAvatarBase64 = null;
    let activeMessageUnsubscribe = null;

    let accountsDb = {};
    let rooms = [];
    let dms = [];
    const unreadRooms = new Set();
    const backgroundUnsubscribers = {};

    const joinedPrivateRooms = new Set(JSON.parse(localStorage.getItem('howapp_unlocked_rooms') || '[]'));

    function saveUnlockedRooms() {
      localStorage.setItem('howapp_unlocked_rooms', JSON.stringify(Array.from(joinedPrivateRooms)));
    }

    window.toggleSidebar = (open) => {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (open) {
        sidebar.classList.add('open');
        overlay.classList.add('active');
      } else {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      }
    };

    window.handleEnter = (event, callback) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        callback();
      }
    };

    window.addEventListener('load', () => {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.permission !== "denied" && Notification.requestPermission();
      }

      onSnapshot(collection(db, "accounts"), (snapshot) => {
        snapshot.forEach((docSnap) => {
          accountsDb[docSnap.id] = docSnap.data();
        });
        
        if (currentUser && accountsDb[currentUser.username.toLowerCase()]) {
          currentUser.avatar = accountsDb[currentUser.username.toLowerCase()].avatar || '';
          updateUserUI();
        }

        const savedSession = localStorage.getItem('howapp_session_user');
        if (savedSession && accountsDb[savedSession.toLowerCase()] && !currentUser) {
          currentUser = {
            username: savedSession,
            avatar: accountsDb[savedSession.toLowerCase()].avatar || ''
          };
          document.getElementById('auth-modal').classList.add('hidden');
          initWorkspace();
        }
      });
    });

    function initWorkspace() {
      updateUserUI();
      listenToRooms();
      listenToDMs();
      selectRoom('global-general');
    }

    function isRoomAccessible(roomId) {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return true;
      if (!room.passcode) return true;
      if (room.creator && currentUser && room.creator.toLowerCase() === currentUser.username.toLowerCase()) return true;
      return joinedPrivateRooms.has(roomId);
    }

    function attachUnreadListener(roomId) {
      if (backgroundUnsubscribers[roomId]) return;

      const q = query(
        collection(db, "chats", roomId, "messages"),
        orderBy("timestamp", "asc")
      );

      let initialLoad = true;
      const unsub = onSnapshot(q, (snapshot) => {
        if (!initialLoad && snapshot.docChanges().length > 0) {
          snapshot.docChanges().forEach((change) => {
            if (change.type === "added") {
              const msgData = change.doc.data();
              if (currentUser && msgData.user !== currentUser.username && roomId !== currentRoomId) {
                if (isRoomAccessible(roomId)) {
                  unreadRooms.add(roomId);
                  renderRoomList();
                  renderDmList();
                  triggerNotification(roomId, msgData);
                }
              }
            }
          });
        }
        initialLoad = false;
      });

      backgroundUnsubscribers[roomId] = unsub;
    }

    window.switchAuthTab = (tab) => {
      document.getElementById('login-view').classList.toggle('hidden', tab !== 'login');
      document.getElementById('signup-view').classList.toggle('hidden', tab !== 'signup');
      document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
      document.getElementById('tab-signup-btn').classList.toggle('active', tab === 'signup');
    };

    window.processSignup = async () => {
      const u = document.getElementById('signup-username').value.trim();
      const p = document.getElementById('signup-password').value.trim();

      if (!u || !p) return alert('Please enter both username and password.');
      if (accountsDb[u.toLowerCase()]) return alert('Username already registered!');

      await setDoc(doc(db, "accounts", u.toLowerCase()), {
        username: u,
        password: p,
        avatar: ''
      });

      loginUser({ username: u, avatar: '' });
    };

    window.processLogin = () => {
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();

      const acc = accountsDb[u.toLowerCase()];
      if (!acc || acc.password !== p) return alert('Invalid login credentials.');

      loginUser({ username: acc.username, avatar: acc.avatar || '' });
    };

    function loginUser(userObj) {
      currentUser = { username: userObj.username, avatar: userObj.avatar || '' };
      localStorage.setItem('howapp_session_user', currentUser.username);
      document.getElementById('auth-modal').classList.add('hidden');
      initWorkspace();
    }

    window.processLogout = () => {
      localStorage.removeItem('howapp_session_user');
      window.location.reload();
    };

    function updateUserUI() {
      document.getElementById('user-badge-name').innerText = `@${currentUser.username}`;
      const badgeAvatar = document.getElementById('user-badge-avatar');

      if (currentUser.avatar) {
        badgeAvatar.innerHTML = `<img src="${currentUser.avatar}" />`;
      } else {
        badgeAvatar.innerText = currentUser.username.charAt(0).toUpperCase();
      }
    }

    window.openAccountSettings = () => {
      document.getElementById('settings-username').value = currentUser.username;
      document.getElementById('settings-new-password').value = '';

      const acc = accountsDb[currentUser.username.toLowerCase()];
      tempAvatarBase64 = acc ? acc.avatar : (currentUser.avatar || null);

      const previewImg = document.getElementById('avatar-preview-img');
      const placeholder = document.getElementById('avatar-preview-placeholder');

      if (tempAvatarBase64) {
        previewImg.src = tempAvatarBase64;
        previewImg.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        previewImg.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }

      openModal('account-settings-modal');
    };

    window.handleAvatarSelect = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 80;
          canvas.height = 80;
          ctx.drawImage(img, 0, 0, 80, 80);
          tempAvatarBase64 = canvas.toDataURL('image/jpeg', 0.8);

          const previewImg = document.getElementById('avatar-preview-img');
          previewImg.src = tempAvatarBase64;
          previewImg.classList.remove('hidden');
          document.getElementById('avatar-preview-placeholder').classList.add('hidden');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.saveAccountSettings = async () => {
      const acc = accountsDb[currentUser.username.toLowerCase()];
      const newPasswordInput = document.getElementById('settings-new-password').value.trim();
      const updatedPassword = newPasswordInput.length > 0 ? newPasswordInput : (acc ? acc.password : '');
      const updatedAvatar = tempAvatarBase64 || '';

      await updateDoc(doc(db, "accounts", currentUser.username.toLowerCase()), {
        password: updatedPassword,
        avatar: updatedAvatar
      });

      currentUser.avatar = updatedAvatar;
      updateUserUI();
      closeModal('account-settings-modal');
    };

    function listenToRooms() {
      onSnapshot(collection(db, "rooms"), (snapshot) => {
        rooms = [];
        let hasGeneral = false;

        snapshot.forEach((docSnap) => {
          const r = { id: docSnap.id, ...docSnap.data() };
          rooms.push(r);
          if (r.id === 'global-general') hasGeneral = true;
        });

        if (!hasGeneral) {
          setDoc(doc(db, "rooms", "global-general"), {
            name: "General",
            passcode: "",
            creator: "system",
            isDefault: true
          });
        }

        renderRoomList();
      });
    }

    function renderRoomList() {
      const listContainer = document.getElementById('room-list');
      if (!listContainer) return;
      listContainer.innerHTML = '';

      rooms.forEach((room) => {
        attachUnreadListener(room.id);
        const item = document.createElement('div');
        item.className = `room-item ${room.id === currentRoomId ? 'active' : ''}`;

        const isPrivate = room.passcode && room.passcode.length > 0;
        const isCreator = currentUser && room.creator && room.creator.toLowerCase() === currentUser.username.toLowerCase();
        const hasUnread = unreadRooms.has(room.id);

        item.innerHTML = `
          <div class="room-info" onclick="attemptJoinRoom('${room.id}')" style="flex:1;">
            <span class="room-icon">#</span>
            <span class="room-name">${escapeHtml(room.name)}</span>
          </div>
          ${hasUnread 
            ? `<span class="badge unread">Unread</span>`
            : `<span class="badge ${isPrivate ? 'private' : 'public'}">${isPrivate ? 'Private' : 'Public'}</span>`
          }
          ${isCreator && !room.isDefault ? `
            <button class="icon-btn" onclick="openCreatorSettingsModal(event, '${room.id}')" title="Settings" style="margin-left:6px;">
              <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg>
            </button>
          ` : ''}
        `;
        listContainer.appendChild(item);
      });
    }

    function listenToDMs() {
      onSnapshot(collection(db, "dms"), (snapshot) => {
        dms = [];
        snapshot.forEach((docSnap) => {
          dms.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderDmList();
      });
    }

    function renderDmList() {
      const dmContainer = document.getElementById('dm-list');
      if (!dmContainer || !currentUser) return;
      dmContainer.innerHTML = '';

      const myDms = dms.filter(d => 
        d.user1.toLowerCase() === currentUser.username.toLowerCase() || 
        d.user2.toLowerCase() === currentUser.username.toLowerCase()
      );

      myDms.forEach((dm) => {
        attachUnreadListener(dm.id);
        const otherUser = dm.user1.toLowerCase() === currentUser.username.toLowerCase() ? dm.user2 : dm.user1;
        const otherAcc = accountsDb[otherUser.toLowerCase()];
        const hasUnread = unreadRooms.has(dm.id);

        const item = document.createElement('div');
        item.className = `room-item ${dm.id === currentRoomId ? 'active' : ''}`;
        item.onclick = () => selectRoom(dm.id, `@${otherUser}`);

        const avatarMarkup = (otherAcc && otherAcc.avatar) 
          ? `<img src="${otherAcc.avatar}" style="width:18px;height:18px;border-radius:50%;object-fit:cover;" />`
          : `@`;

        item.innerHTML = `
          <div class="room-info" style="flex:1;">
            <span class="room-icon">${avatarMarkup}</span>
            <span class="room-name">${escapeHtml(otherUser)}</span>
          </div>
          ${hasUnread 
            ? `<span class="badge unread">Unread</span>`
            : `<span class="badge dm">Direct</span>`
          }
        `;
        dmContainer.appendChild(item);
      });
    }

    window.attemptJoinRoom = (roomId) => {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;

      const isCreator = currentUser && room.creator && room.creator.toLowerCase() === currentUser.username.toLowerCase();

      if (room.passcode && !isCreator && !joinedPrivateRooms.has(roomId)) {
        pendingRoomId = roomId;
        document.getElementById('room-pass-input').value = '';
        openModal('passcode-modal');
      } else {
        selectRoom(roomId);
      }
    };

    window.verifyPasscode = () => {
      const input = document.getElementById('room-pass-input').value;
      const room = rooms.find(r => r.id === pendingRoomId);

      if (room && room.passcode === input) {
        joinedPrivateRooms.add(pendingRoomId);
        saveUnlockedRooms();
        selectRoom(pendingRoomId);
        closeModal('passcode-modal');
      } else {
        alert('Incorrect passcode!');
      }
    };

    window.createRoom = async () => {
      const name = document.getElementById('new-room-name').value.trim();
      const pass = document.getElementById('new-room-pass').value.trim();

      if (!name) return alert('Enter a channel name.');

      const newRef = doc(collection(db, "rooms"));
      await setDoc(newRef, {
        name: name,
        passcode: pass,
        creator: currentUser.username
      });

      if (pass) {
        joinedPrivateRooms.add(newRef.id);
        saveUnlockedRooms();
      }

      document.getElementById('new-room-name').value = '';
      document.getElementById('new-room-pass').value = '';
      closeModal('create-room-modal');

      selectRoom(newRef.id);
    };

    window.createDM = async () => {
      const targetUser = document.getElementById('dm-target-username').value.trim();

      if (!targetUser) return alert('Enter target username.');
      if (targetUser.toLowerCase() === currentUser.username.toLowerCase()) return alert('Cannot DM yourself.');
      if (!accountsDb[targetUser.toLowerCase()]) return alert(`User "@${targetUser}" was not found.`);

      const sorted = [currentUser.username.toLowerCase(), targetUser.toLowerCase()].sort();
      const dmId = `dm-${sorted[0]}--${sorted[1]}`;

      await setDoc(doc(db, "dms", dmId), {
        user1: currentUser.username,
        user2: targetUser
      });

      document.getElementById('dm-target-username').value = '';
      closeModal('create-dm-modal');

      selectRoom(dmId, `@${targetUser}`);
    };

    window.openCreatorSettingsModal = (e, roomId) => {
      e.stopPropagation();
      targetCreatorRoomId = roomId;
      const room = rooms.find(r => r.id === roomId);

      document.getElementById('edit-room-name').value = room.name;
      document.getElementById('edit-room-pass').value = room.passcode || '';
      openModal('creator-settings-modal');
    };

    window.saveRoomEdits = async () => {
      const newName = document.getElementById('edit-room-name').value.trim();
      const newPass = document.getElementById('edit-room-pass').value.trim();

      if (!newName) return alert('Channel name required.');

      await updateDoc(doc(db, "rooms", targetCreatorRoomId), {
        name: newName,
        passcode: newPass
      });

      closeModal('creator-settings-modal');
    };

    window.deleteRoom = async () => {
      if (confirm("Delete this channel permanently?")) {
        await deleteDoc(doc(db, "rooms", targetCreatorRoomId));
        closeModal('creator-settings-modal');
        selectRoom('global-general');
      }
    };

    function selectRoom(roomId, customTitle = null) {
      if (activeMessageUnsubscribe) activeMessageUnsubscribe();

      unreadRooms.delete(roomId);
      currentRoomId = roomId;

      const room = rooms.find(r => r.id === roomId);
      document.getElementById('current-room-title').innerText = customTitle ? customTitle : `# ${room ? room.name : 'Channel'}`;
      document.getElementById('messages-container').innerHTML = '';

      const q = query(
        collection(db, "chats", roomId, "messages"), 
        orderBy("timestamp", "asc")
      );

      activeMessageUnsubscribe = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';

        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          appendMessageUI(msg);
        });
      });

      renderRoomList();
      renderDmList();
      toggleSidebar(false);
    }

    window.sendMessage = async () => {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentRoomId) return;

      const userAcc = accountsDb[currentUser.username.toLowerCase()];
      
      await addDoc(collection(db, "chats", currentRoomId, "messages"), {
        user: currentUser.username,
        avatar: (userAcc && userAcc.avatar) ? userAcc.avatar : (currentUser.avatar || ''),
        text: text,
        timestamp: serverTimestamp(),
        displayTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      input.value = '';
    };

    function appendMessageUI(msg) {
      const container = document.getElementById('messages-container');
      const isOwn = currentUser && (msg.user === currentUser.username);
      const msgEl = document.createElement('div');
      msgEl.className = `message ${isOwn ? 'own' : ''}`;

      const initial = msg.user ? msg.user.charAt(0).toUpperCase() : '?';
      const userAcc = accountsDb[msg.user ? msg.user.toLowerCase() : ''];
      const avatarSrc = (userAcc && userAcc.avatar) ? userAcc.avatar : msg.avatar;

      const avatarMarkup = avatarSrc 
        ? `<img src="${avatarSrc}" alt="${msg.user}" />`
        : initial;

      msgEl.innerHTML = `
        <div class="avatar-container">${avatarMarkup}</div>
        <div class="message-content-wrapper">
          <div class="meta">
            <span class="author">${escapeHtml(msg.user || 'Unknown')}</span>
            <span>${msg.displayTime || ''}</span>
          </div>
          <div class="message-bubble">${escapeHtml(msg.text || '')}</div>
        </div>
      `;

      container.appendChild(msgEl);
      container.scrollTop = container.scrollHeight;
    }

    function triggerNotification(roomId, msgData) {
      if ("Notification" in window && Notification.permission === "granted") {
        let title = "HowApp Message";
        const room = rooms.find(r => r.id === roomId);

        if (room) title = `#${room.name}`;
        else if (roomId.startsWith('dm-')) title = `DM from @${msgData.user}`;

        const notif = new Notification(title, {
          body: `${msgData.user}: ${msgData.text}`,
          icon: msgData.avatar || undefined
        });

        notif.onclick = () => {
          window.focus();
          attemptJoinRoom(roomId);
        };
      }
    }

    window.openModal = (id) => {
      document.getElementById(id).classList.remove('hidden');
      const input = document.getElementById(id).querySelector('input:not([disabled])');
      if (input) input.focus();
    };
    window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  </script>
</body>
</html>
