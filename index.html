<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Multi-Device Chat</title>
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 900px; height: 90vh; background-color: #1e293b; border-radius: 12px; display: flex; overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
    
    .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .modal { background: #1e293b; padding: 24px; border-radius: 8px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
    .modal h2 { font-size: 1.25rem; color: #38bdf8; }
    
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
    button { padding: 10px 16px; border: none; border-radius: 6px; background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #0369a1; }

    .sidebar { width: 280px; background-color: #0f172a; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .user-badge { font-size: 0.85rem; color: #94a3b8; }
    .room-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .room-item { padding: 10px 12px; border-radius: 6px; background: #1e293b; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .room-item:hover, .room-item.active { background: #334155; }
    .room-item .badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #475569; }
    .room-item .badge.private { background: #e11d48; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: #1e293b; }
    .chat-header { padding: 16px; border-bottom: 1px solid #334155; font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
    .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 8px; background: #334155; display: flex; flex-direction: column; gap: 4px; }
    .message.own { align-self: flex-end; background: #0284c7; }
    .message .meta { font-size: 0.75rem; color: #cbd5e1; display: flex; justify-content: space-between; gap: 12px; }
    .message .text { font-size: 0.95rem; word-break: break-word; }

    .input-area { padding: 16px; border-top: 1px solid #334155; display: flex; gap: 8px; }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .app-container { flex-direction: column; height: 100vh; border-radius: 0; }
      .sidebar { width: 100%; height: 35%; }
      .chat-area { height: 65%; }
    }
  </style>
</head>
<body>

  <div id="username-modal" class="overlay">
    <div class="modal">
      <h2>Welcome</h2>
      <p style="font-size: 0.9rem; color: #94a3b8;">Enter a nickname to enter real-time chat.</p>
      <input type="text" id="username-input" placeholder="Display name..." />
      <button onclick="saveUsername()">Join App</button>
    </div>
  </div>

  <div id="passcode-modal" class="overlay hidden">
    <div class="modal">
      <h2>Protected Room</h2>
      <p style="font-size: 0.9rem; color: #94a3b8;">Enter the passcode for this channel.</p>
      <input type="password" id="room-pass-input" placeholder="Passcode" />
      <div style="display:flex; gap: 8px;">
        <button onclick="verifyPasscode()" style="flex:1;">Enter</button>
        <button onclick="closeModal('passcode-modal')" style="background:#475569;">Cancel</button>
      </div>
    </div>
  </div>

  <div id="create-room-modal" class="overlay hidden">
    <div class="modal">
      <h2>Create Channel</h2>
      <input type="text" id="new-room-name" placeholder="Room Name" />
      <input type="password" id="new-room-pass" placeholder="Passcode (Optional)" />
      <div style="display:flex; gap: 8px;">
        <button onclick="createRoom()" style="flex:1;">Create</button>
        <button onclick="closeModal('create-room-modal')" style="background:#475569;">Cancel</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <div>
          <strong>Channels</strong>
          <div id="user-display" class="user-badge"></div>
        </div>
        <button onclick="openModal('create-room-modal')" style="padding: 6px 10px; font-size: 0.8rem;">+ New</button>
      </div>
      <div class="room-list" id="room-list"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="current-room-title">Select a Channel</div>
      <div class="messages-container" id="messages-container"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMessage()" />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // REPLACE WITH YOUR FREE ABLY API KEY FROM ABLY.COM
    const ABLY_API_KEY = 'LDAdyw.d365Vw:DgFTHDyC7dDCOglWbLR7ETmDhw5eJudFqcpM0V1XGyg';

    let ably, globalChannel, currentChannel;
    let username = localStorage.getItem('chat_username') || '';
    let currentRoomId = null;
    let pendingRoomId = null;

    // Room state shared via public meta channel
    let rooms = [
      { id: 'global-general', name: 'General', passcode: '' }
    ];

    window.onload = function() {
      if (username) {
        document.getElementById('username-modal').classList.add('hidden');
        initChat();
      }
    };

    function saveUsername() {
      const input = document.getElementById('username-input').value.trim();
      if (!input) return;
      username = input;
      localStorage.setItem('chat_username', username);
      document.getElementById('username-modal').classList.add('hidden');
      initChat();
    }

    function initChat() {
      document.getElementById('user-display').innerText = `@${username}`;
      
      // Initialize Ably Client
      ably = new Ably.Realtime(ABLY_API_KEY);

      // Listen for network room creations across all clients
      globalChannel = ably.channels.get('room-directory');
      globalChannel.subscribe('new-room', (msg) => {
        if (!rooms.some(r => r.id === msg.data.id)) {
          rooms.push(msg.data);
          renderRoomList();
        }
      });

      renderRoomList();
      selectRoom('global-general');
    }

    function renderRoomList() {
      const listContainer = document.getElementById('room-list');
      listContainer.innerHTML = '';

      rooms.forEach(room => {
        const item = document.createElement('div');
        item.className = `room-item ${room.id === currentRoomId ? 'active' : ''}`;
        item.onclick = () => attemptJoinRoom(room.id);

        const isPrivate = room.passcode && room.passcode.length > 0;
        item.innerHTML = `
          <span># ${escapeHtml(room.name)}</span>
          <span class="badge ${isPrivate ? 'private' : ''}">${isPrivate ? 'Private' : 'Public'}</span>
        `;
        listContainer.appendChild(item);
      });
    }

    function attemptJoinRoom(roomId) {
      const room = rooms.find(r => r.id === roomId);
      if (!room) return;

      if (room.passcode) {
        pendingRoomId = roomId;
        document.getElementById('room-pass-input').value = '';
        openModal('passcode-modal');
      } else {
        selectRoom(roomId);
      }
    }

    function verifyPasscode() {
      const input = document.getElementById('room-pass-input').value;
      const room = rooms.find(r => r.id === pendingRoomId);

      if (room && room.passcode === input) {
        selectRoom(pendingRoomId);
        closeModal('passcode-modal');
      } else {
        alert('Incorrect passcode!');
      }
    }

    function selectRoom(roomId) {
      if (currentChannel) {
        currentChannel.unsubscribe();
      }

      currentRoomId = roomId;
      const room = rooms.find(r => r.id === roomId);
      document.getElementById('current-room-title').innerText = `# ${room.name}`;
      document.getElementById('messages-container').innerHTML = '';

      // Subscribe to real-time events for this specific room
      currentChannel = ably.channels.get(`chat-${roomId}`);
      
      // Fetch stored message history across devices
      currentChannel.history({ limit: 50 }, (err, resultPage) => {
        if (!err) {
          const historyMsgs = resultPage.items.reverse();
          historyMsgs.forEach(msg => appendMessage(msg.data));
        }
      });

      currentChannel.subscribe('msg', (msg) => {
        appendMessage(msg.data);
      });

      renderRoomList();
    }

    function createRoom() {
      const name = document.getElementById('new-room-name').value.trim();
      const pass = document.getElementById('new-room-pass').value.trim();
      if (!name) return;

      const newRoom = {
        id: 'room-' + Date.now(),
        name: name,
        passcode: pass
      };

      // Broadcast new room creation to all connected devices
      globalChannel.publish('new-room', newRoom);

      document.getElementById('new-room-name').value = '';
      document.getElementById('new-room-pass').value = '';
      closeModal('create-room-modal');

      selectRoom(newRoom.id);
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentChannel) return;

      const payload = {
        user: username,
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      currentChannel.publish('msg', payload);
      input.value = '';
    }

    function appendMessage(msg) {
      const container = document.getElementById('messages-container');
      const isOwn = msg.user === username;
      const msgEl = document.createElement('div');
      msgEl.className = `message ${isOwn ? 'own' : ''}`;
      
      msgEl.innerHTML = `
        <div class="meta">
          <span>${escapeHtml(msg.user)}</span>
          <span>${msg.timestamp}</span>
        </div>
        <div class="text">${escapeHtml(msg.text)}</div>
      `;
      container.appendChild(msgEl);
      container.scrollTop = container.scrollHeight;
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  </script>
</body>
</html>
